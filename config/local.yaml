project:
  name: chandrayaan2_tmc2_ohrc_correspondence
  problem_statement_id: 26166

dataset:
  source_priority:
    - huggingface
    - local

  huggingface:
    enabled: true
    repo_id: "ISRO/chandrayaan2-correspondence"
    repo_type: "dataset"
    revision: "main"
    cache_dir: "./data/cache/huggingface"
    token_env: "HF_TOKEN"

  local:
    enabled: true
    root_dir: "./dataset/triplet_1"

  pairs:
    pair_01:
      tmc2_xml: "ch2_tmc_ncf_20250807T1904346039_d_img_d18/data/calibrated/20250807/ch2_tmc_ncf_20250807T1904346039_d_img_d18.xml"
      tmc2_img: "ch2_tmc_ncf_20250807T1904346039_d_img_d18/data/calibrated/20250807/ch2_tmc_ncf_20250807T1904346039_d_img_d18.img"
      ohrc_xml: "ch2_ohr_ncp_20210405T1606536730_d_img_d18/data/calibrated/20210405/ch2_ohr_ncp_20210405T1606536730_d_img_d18.xml"
      ohrc_img: "ch2_ohr_ncp_20210405T1606536730_d_img_d18/data/calibrated/20210405/ch2_ohr_ncp_20210405T1606536730_d_img_d18.img"

sensors:
  TMC2:
    nominal_resolution_m: 5.0
  OHRC:
    nominal_resolution_m: 0.30

preprocessing:
  preserve_native_images: true
  illumination:
    enabled: true
    metadata:
      use_solar_azimuth: true
      use_solar_elevation: true
      use_incidence_angle: true
    percentile_normalization:
      enabled: true
      low: 2
      high: 98
    local_contrast:
      enabled: true
    gradient_representation:
      enabled: true
    shadow_mask:
      enabled: true

scale:
  strategy: "multiscale"
  pyramid:
    enabled: true
    levels: 6
  interpolation:
    method: "bicubic"

matching:
  backend: "custom"
  allow_optional_sift_baseline: false
  use_orb: false

geometric_verification:
  enabled: true
  model: "auto"
  ransac:
    enabled: true

uniform_distribution:
  enabled: true
  grid_rows: 8
  grid_cols: 8
  max_matches_per_cell: 5

subpixel:
  enabled: true

evaluation:
  metrics:
    - rmse_pixels
    - rmse_meters
    - inlier_count
    - inlier_ratio
    - spatial_coverage

output:
  root_dir: "./outputs"
  save_registered: true
  save_matches_csv: true
  save_visualization: true
  save_overlay: true
  save_metrics_json: true
