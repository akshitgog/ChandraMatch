services:
  - type: web
    name: chandramatch-api
    runtime: python
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CHANDRAMATCH_CONFIG
        value: config/render.yaml
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HF_TOKEN
        sync: false
